[project]
name        = "houtini-ai"
version     = "1.1.2"
description = "Per-sentence AI-text detection with pattern diagnostics — CLI."
authors     = [{ name = "Richard Baxter", email = "richard@houtini.com" }]
readme      = "README.md"
license     = "MIT"
requires-python = ">=3.12"
license-files = ["LICENSE"]

dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "transformers>=5.20.2",
]

# ── Hardware extras (mutually exclusive) ─────────────────────────────────────
# Usage: uv sync --extra cpu / --extra xpu / --extra cuda
# Tool: uv tool install 'houtini-ai[xpu]' --index https://download.pytorch.org/whl/xpu

[project.optional-dependencies]
cpu = [
    "torch>=2.8",
    "torchvision>=0.23",
]
xpu = [
    "torch>=2.8",
    "torchvision>=0.23",
    "accelerate>=1.10.1",
    "huggingface_hub>=0.34.4",
    "safetensors>=0.6.2",
    "triton-xpu>=3.8.0",
]
cuda = [
    "torch>=2.8",
    "torchvision>=0.23",
    "accelerate>=1.10.1",
    "huggingface_hub>=0.34.4",
    "safetensors>=0.6.2",
]

# Light ONNX model (no torch)
light = ["onnxruntime>=1.17"]

[project.scripts]
houtini-ai = "ai_detect.cli:main"

[project.urls]
Repository = "https://github.com/kpihx-labs/houtini-ai"
Mirror = "https://gitlab.com/kpihx-labs/ai/llm-detectors/houtini-ai"
Upstream = "https://github.com/houtini-ai/ai-detect"

[tool.uv]
package = true
index-strategy = "unsafe-best-match"
prerelease = "allow"
conflicts = [
    [{ extra = "cpu" }, { extra = "xpu" }, { extra = "cuda" }],
]

# ── PyTorch indexes (explicit — only used when the matching extra is selected) ─

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[build-system]
requires      = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_detect"
source-include = ["Makefile", "tests/**", "scripts/**", "RELEASE-NOTES.md"]
source-exclude = ['*\~', "*.bak"]

# ── Development dependencies ─────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ISC"]
ignore = [
    "W291",
    "W293",
    "E501",
    "UP042",
]

[tool.pyright]
typeCheckingMode = "basic"
